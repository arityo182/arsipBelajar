name: Deploy
# Auto-deployment SIPLOK (Synchronized with VPS_* credentials)

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Semua test dijalankan sebagai reusable workflow. Build dan deploy hanya
  # berjalan jika seluruh job CI lulus.
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & Push — ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            image: siplok-backend
            dockerfile: docker/backend/Dockerfile
          - name: frontend
            context: .
            image: siplok-frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=sha-${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.channel }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy-staging:
    name: Deploy to Staging
    needs: build-push
    if: github.ref_name == 'develop'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: staging
      url: https://arsip.arityodev.my.id

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ~/siplok/
          strip_components: 1

      - name: Deploy staging
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/siplok
            test -f .env || { echo "ERROR: ~/siplok/.env belum ada"; exit 1; }

            docker image prune -f || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180
            docker image prune -f || true

            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force || true

            ok=0
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:8002/api/publik/cek >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8002/ >/dev/null 2>&1; then
                ok=1
                echo "Backend staging sehat setelah ${i} percobaan"
                break
              fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi

            curl -fsS -o /dev/null http://127.0.0.1:3002/
            docker compose -f docker-compose.prod.yml ps
            echo "Staging deployed: IMAGE_TAG=${IMAGE_TAG}"

  deploy-production:
    name: Deploy to Production
    needs: build-push
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://arsip.arityodev.my.id

    steps:
      - uses: actions/checkout@v4

      - name: Copy compose file
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: deploy/docker-compose.prod.yml
          target: ~/siplok/
          strip_components: 1

      - name: Deploy production
        uses: appleboy/ssh-action@v1
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: sha-${{ github.sha }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail
            cd ~/siplok
            test -f .env || { echo "ERROR: ~/siplok/.env belum ada"; exit 1; }

            docker image prune -f || true
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 180
            docker image prune -f || true

            docker compose -f docker-compose.prod.yml exec -T backend php artisan migrate --force || true

            ok=0
            for i in $(seq 1 36); do
              if curl -fsS http://127.0.0.1:8002/api/publik/cek >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8002/ >/dev/null 2>&1; then
                ok=1
                echo "Backend production sehat setelah ${i} percobaan"
                break
              fi
              sleep 5
            done

            if [ "$ok" -ne 1 ]; then
              docker compose -f docker-compose.prod.yml ps
              docker compose -f docker-compose.prod.yml logs --tail=100 backend
              exit 1
            fi

            curl -fsS -o /dev/null http://127.0.0.1:3002/
            docker compose -f docker-compose.prod.yml ps
            echo "Production deployed: IMAGE_TAG=${IMAGE_TAG}"
