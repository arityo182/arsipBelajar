name: Deploy

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Seluruh tes CI dijalankan terlebih dahulu sebagai reusable workflow.
  # Build dan deploy hanya berjalan jika seluruh job CI lulus 100%.
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & Push — ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            image: siplok-backend
            dockerfile: docker/backend/Dockerfile
          - name: frontend
            context: .
            image: siplok-frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.channel }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to EC2 VPS (${{ github.ref_name }})
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Copy docker-compose file to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ coalesce(secrets.EC2_HOST, secrets.VPS_HOST) }}
          username: ${{ coalesce(secrets.EC2_USER, secrets.VPS_USER) }}
          key: ${{ coalesce(secrets.EC2_SSH_KEY, secrets.VPS_SSH_KEY) }}
          port: ${{ coalesce(secrets.VPS_PORT, '22') }}
          source: deploy/docker-compose.prod.yml
          target: ~/siplok/
          strip_components: 1

      - name: Deploy & Rolling Update via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          IMAGE_TAG: ${{ steps.vars.outputs.channel }}
        with:
          host: ${{ coalesce(secrets.EC2_HOST, secrets.VPS_HOST) }}
          username: ${{ coalesce(secrets.EC2_USER, secrets.VPS_USER) }}
          key: ${{ coalesce(secrets.EC2_SSH_KEY, secrets.VPS_SSH_KEY) }}
          port: ${{ coalesce(secrets.VPS_PORT, '22') }}
          envs: DOCKERHUB_USERNAME,IMAGE_TAG
          script: |
            set -euo pipefail
            echo "=== Memulai Deployment SIPLOK di VPS ==="
            cd ~/siplok || exit 1
            test -f .env || { echo "ERROR: ~/siplok/.env belum ditemukan!"; exit 1; }

            cp -f docker-compose.prod.yml docker-compose.yml 2>/dev/null || true

            echo "Pulling latest docker images..."
            docker compose pull

            echo "Upgrading containers..."
            docker compose up -d --remove-orphans

            echo "Verifikasi kesehatan backend & frontend..."
            ok=0
            for i in $(seq 1 30); do
              if curl -fsS http://127.0.0.1:8002/api/auth/me >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8002/ >/dev/null 2>&1; then
                ok=1
                echo "Backend SIPLOK siap setelah ${i} percobaan"
                break
              fi
              sleep 3
            done

            curl -fsS -o /dev/null http://127.0.0.1:3002/ || true
            docker compose ps
            docker system prune -f
            echo "=== Deployment SIPLOK Sukses Selesai ==="
