name: Deploy

on:
  push:
    branches: [develop, main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'

permissions:
  contents: read

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  # Seluruh tes CI dijalankan terlebih dahulu sebagai reusable workflow.
  # Build dan deploy hanya berjalan jika seluruh job CI lulus 100%.
  ci:
    uses: ./.github/workflows/ci.yml

  build-push:
    name: Build & Push — ${{ matrix.name }}
    needs: ci
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: backend
            context: .
            image: siplok-backend
            dockerfile: docker/backend/Dockerfile
          - name: frontend
            context: .
            image: siplok-frontend
            dockerfile: docker/frontend/Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set image tags
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi
          echo "sha_tag=sha-${GITHUB_SHA::8}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build & Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            NEXT_PUBLIC_API_URL=/api
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.channel }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ matrix.image }}:${{ steps.vars.outputs.sha_tag }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  deploy:
    name: Deploy to EC2 VPS (${{ github.ref_name }})
    needs: build-push
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - name: Set deployment variables
        id: vars
        run: |
          if [ "${GITHUB_REF_NAME}" = "main" ]; then
            echo "channel=latest" >> "$GITHUB_OUTPUT"
          else
            echo "channel=staging" >> "$GITHUB_OUTPUT"
          fi

      - name: Deploy to VPS via SSH
        env:
          KEY_EC2: ${{ secrets.EC2_SSH_KEY }}
          KEY_VPS: ${{ secrets.VPS_SSH_KEY }}
          HOST_EC2: ${{ secrets.EC2_HOST }}
          HOST_VPS: ${{ secrets.VPS_HOST }}
          USER_EC2: ${{ secrets.EC2_USER }}
          USER_VPS: ${{ secrets.VPS_USER }}
          IMAGE_TAG: ${{ steps.vars.outputs.channel }}
        run: |
          set -euo pipefail

          # 1. Resolusi Kunci Privat SSH
          SSH_KEY="${KEY_EC2:-$KEY_VPS}"
          if [ -z "$SSH_KEY" ]; then
            echo "::error::Secret EC2_SSH_KEY atau VPS_SSH_KEY tidak ditemukan di GitHub Repository Secrets!"
            exit 1
          fi

          # 2. Resolusi Host & User SSH (Default: 13.218.77.9 & ubuntu)
          TARGET_HOST="${HOST_EC2:-${HOST_VPS:-13.218.77.9}}"
          TARGET_USER="${USER_EC2:-${USER_VPS:-ubuntu}}"

          echo "Menyiapkan autentikasi SSH untuk ${TARGET_USER}@${TARGET_HOST}..."
          mkdir -p ~/.ssh
          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "Menyalin docker-compose.prod.yml ke VPS..."
          scp -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa deploy/docker-compose.prod.yml "${TARGET_USER}@${TARGET_HOST}":~/siplok/docker-compose.yml

          echo "Menjalankan pembaruan kontainer di VPS..."
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/id_rsa "${TARGET_USER}@${TARGET_HOST}" "
            set -euo pipefail
            cd ~/siplok
            test -f .env || { echo 'ERROR: ~/siplok/.env belum ditemukan!'; exit 1; }

            echo 'Pulling latest docker images...'
            docker compose pull

            echo 'Upgrading containers...'
            docker compose up -d --remove-orphans

            echo 'Verifikasi kesehatan backend & frontend...'
            for i in \$(seq 1 30); do
              if curl -fsS http://127.0.0.1:8002/api/auth/me >/dev/null 2>&1 || curl -fsS http://127.0.0.1:8002/ >/dev/null 2>&1; then
                echo \"Backend SIPLOK siap setelah \${i} percobaan\"
                break
              fi
              sleep 3
            done

            curl -fsS -o /dev/null http://127.0.0.1:3002/ || true
            docker compose ps
            docker system prune -f
            echo '=== Deployment SIPLOK Sukses Selesai ==='
          "
